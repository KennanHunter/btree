name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Core tests
        run: pnpm --filter core test

      - name: Build vis
        run: pnpm --filter vis build

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build vis
        run: pnpm --filter vis build

      # Deploy the built site as a Cloudflare Worker with Static Assets.
      # Requires two repo secrets:
      #   CLOUDFLARE_API_TOKEN  — a token with the "Edit Cloudflare Workers"
      #                           template (or equivalent scopes).
      #   CLOUDFLARE_ACCOUNT_ID — the account ID that owns the worker.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: vis
          packageManager: pnpm
          command: deploy

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip tests and go straight to deploy
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Core tests
        run: pnpm --filter core test

      - name: Build vis
        run: pnpm --filter vis build

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Build vis
        run: pnpm --filter vis build

      # Deploy the built site as a Cloudflare Worker with Static Assets.
      # Requires two repo secrets:
      #   CLOUDFLARE_API_TOKEN  — a token with the "Edit Cloudflare Workers"
      #                           template (or equivalent scopes).
      #   CLOUDFLARE_ACCOUNT_ID — the account ID that owns the worker.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: vis
          packageManager: pnpm
          command: deploy

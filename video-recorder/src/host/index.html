<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>video-recorder host</title>
    <style>
      html, body { margin: 0; padding: 0; background: #1a1a1a; }
      #viewport {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        position: relative;
        background: #1a1a1a;
      }
      #stage {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <div id="viewport"><div id="stage"></div></div>
    <script type="module" src="./host.tsx"></script>
  </body>
</html>
